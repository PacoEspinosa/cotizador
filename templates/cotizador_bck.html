{% extends "base.html" %}

{% block content %}
    <h1>Cotizador</h1>
    <form method="POST">
        <div class="form-group">
            <label for="valor_factura">Valor Factura:</label>
            <input type="number" step="0.01" id="valor_factura" name="valor_factura" value="0" required>
        </div>
        <div class="form-group">
            <label for="accesorios">Accesorios:</label>
            <input type="number" step="0.01" id="accesorios" name="accesorios" value="0" required>
        </div>
        <div class="form-group">
            <label for="plazo_meses">Plazo (meses):</label>
            <input type="number" id="plazo_meses" name="plazo_meses" value="0" required>
        </div>
        <div class="form-group">
            <label for="seguro">Seguro:</label>
            <input type="number" step="0.01" id="seguro" name="seguro" value="0" required>
        </div>
        <div class="form-group">
            <label for="pago_inicial_total">Pago Inicial Total:</label>
            <input type="number" step="0.01" id="pago_inicial_total" name="pago_inicial_total" value="0" required>
        </div>
        <div class="form-group">
            <label for="residual_siva">Residual S/IVA:</label>
            <input type="number" step="0.01" id="residual_siva" name="residual_siva" value="20000" required>
        </div>
        <div class="form-group">
            <label for="monto_inversion">Monto Inversión:</label>
            <input type="number" step="0.01" id="monto_inversion" name="monto_inversion" value="0" required>
        </div>
        <div class="form-group">
            <label for="deposito_garantia">Depósito Garantía:</label>
            <input type="number" step="0.01" id="deposito_garantia" name="deposito_garantia" value="0" required>
        </div>
        <div class="form-group">
            <label for="tipo_vehiculo">Tipo Vehículo (H, E, G):</label>
            <input type="text" id="tipo_vehiculo" name="tipo_vehiculo" value="G" required>
        </div>
        <div class="form-group">
            <label for="tasa_comision_apertura">Tasa Comisión Apertura:</label>
            <input type="number" step="0.01" id="tasa_comision_apertura" name="tasa_comision_apertura" value="1" required>
        </div>
        <div class="form-group">
            <label for="tasa_interes_anual">Tasa Interés Anual:</label>
            <input type="number" step="0.01" id="tasa_interes_anual" name="tasa_interes_anual" value="36" required>
        </div>
        <div class="form-group">
            <label for="num_parametros_facturacion">Número Parámetros Facturación:</label>
            <input type="number" id="num_parametros_facturacion" name="num_parametros_facturacion" value="10" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Consultar API">
        </div>
    </form>

    {% if api_response %}
        <h2>Resultado de la API:</h2>
        <pre>{{ api_response | tojson(indent=2) }}</pre>
    {% elif error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}
{% endblock %}
